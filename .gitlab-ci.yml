stages:
  - build
  - test
  - deploy
  - status
#variable d'environnement gitlab
variables:
  JAR_FILE: "target/freelance-*.jar" #emplacement de jar
  ###############
  ### ENV DEV ###
  ###############
  DEV_USER: "back"
  DEV_PASSWORD: "back"
  DEV_HOST: "172.31.250.128"
  DEV_PATH: "/home/back/freelance.jar"
  #################
  ### ENV PPROD ###
  #################
  PPROD_USER: "bdd"
  PPROD_PASSWORD: "bdd"
  PPROD_HOST: "172.31.250.157"
  PPROD_PATH: "/home/bdd/freelance.jar"

cache:
  paths:
    - ~/.m2/repository  # Cache des dépendances Maven pour accélérer le build

# Étape de build
build-job:
  stage: build
  tags:
    - local
  script:
    - mvn clean package -DskipTests  # Compile le code et générer mon jar sans exécuter les tests
  artifacts:
    paths:
      - $JAR_FILE  #emplacement de jar

# Étape de test
test-job:
  stage: test
  tags:
    - local
  dependencies:
    - build-job
  script:
    - mvn test  # Exécute les tests
  artifacts: #pour voir les raports de test
    paths:
      - target/surefire-reports/*.xml
      - target/surefire-reports/*.txt
    reports:
      junit: target/surefire-reports/*.xml

# Étape de déploiement
deploy-dev-job:
  stage: deploy
  tags:
    - local
  dependencies:
    - build-job #attendre la fin d'exécution de build
  script:
    # Installer sshpass.
    - apt-get update -qq && apt-get install -qqy sshpass
    # Copie le fichier JAR vers le serveur en utilisant scp avec sshpass pour l'authentification.
    - sshpass -p "$DEV_PASSWORD" scp -o StrictHostKeyChecking=no $JAR_FILE $DEV_USER@$DEV_HOST:$DEV_PATH
    # Redémarre le service "freelance" sur le serveur.
    - sshpass -p "$DEV_PASSWORD" ssh -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST "sudo systemctl restart freelance"
  only:
    - develop

deploy-pprod-job:
  stage: deploy
  tags:
    - local
  dependencies:
    - build-job #attendre la fin d'exécution de build
  script:
    # Installer sshpass.
    - apt-get update -qq && apt-get install -qqy sshpass
    # Copie le fichier JAR vers le serveur en utilisant scp avec sshpass pour l'authentification.
    - sshpass -p "$PPROD_PASSWORD" scp -o StrictHostKeyChecking=no $JAR_FILE $PPROD_USER@$PPROD_HOST:$PPROD_PATH
    # Redémarre le service "freelance" sur le serveur.
    - sshpass -p "$PPROD_PASSWORD" ssh -o StrictHostKeyChecking=no $PPROD_USER@$PPROD_HOST "sudo systemctl restart freelance"
  only:
    - staging


# Étape de vérification de l'exécution
status-check:
  stage: status
  tags:
    - local
  script:
    - echo "Vérification de l'état du service freelance..."
    - sshpass -p "$DEV_PASSWORD" ssh -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST "sudo systemctl status freelance"  # Vérifie l'état du service
    - echo "Vérification terminée."
  only:
    - develop
